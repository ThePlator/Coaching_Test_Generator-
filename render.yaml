# Render Blueprint — static landing page only (site/).
# The app itself runs on the teacher's laptop; it is not deployed.
# Render dashboard → New → Blueprint → pick this repo. Then add the .tech
# domain under the service's Settings → Custom Domains.
services:
  - type: web
    name: prashn-patra
    runtime: static
    buildCommand: ""
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
